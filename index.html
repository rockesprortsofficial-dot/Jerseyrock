<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06111f"><title>ROCK ESPORTS | Jersey Viewer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 15%,#12365b,#071523 45%,#03070d);color:#f4fbff;font-family:system-ui,Arial,sans-serif}
header{text-align:center;padding:24px 12px 14px}.brand{font-size:clamp(26px,5vw,42px);font-weight:950;letter-spacing:.14em}.brand span{color:#00e5ff}.sub{color:#9cb4c9;font-size:12px;letter-spacing:.15em;margin-top:7px}
main{width:min(100% - 20px,900px);margin:auto}.viewer{position:relative;min-height:60vh;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #1e5474;border-radius:18px;background:linear-gradient(145deg,#0c243b,#020810);touch-action:pan-y}
.viewer:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 80px,#00d9ff08 81px 83px);pointer-events:none}
.wrap{position:relative;width:min(78%,520px);display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;will-change:transform;cursor:grab}#jersey{width:100%;height:auto;max-height:72vh;object-fit:contain;filter:drop-shadow(0 20px 28px #000b);user-select:none;-webkit-user-drag:none;pointer-events:none}
.hint{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;font-size:12px;color:#c5d9e8;background:#06111fe8;border:1px solid #24506b;border-radius:999px;padding:9px}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}button{border:1px solid #1e7894;background:linear-gradient(#10344a,#081927);color:white;border-radius:11px;padding:11px 14px;font-weight:750;min-height:44px}button.primary{background:linear-gradient(135deg,#00d9f5,#0085c9);color:#00101b;border:0}.status{text-align:center;color:#d7f7ff;font-size:13px}.note{max-width:720px;margin:14px auto;color:#9fb7c9;text-align:center;font-size:13px;line-height:1.6}footer{text-align:center;padding:16px;color:#64849b;font-size:11px}
@media(min-width:700px){.viewer{min-height:650px}.wrap{width:min(58%,520px)}}@media(max-width:480px){.viewer{min-height:62vh}.wrap{width:90%}#jersey{max-height:68vh}button{padding:10px 11px;font-size:13px}}
</style></head><body>
<header><div class="brand">ROCK <span>ESPORTS</span></div><div class="sub">OFFICIAL JERSEY PREVIEW</div></header>
<main><section class="viewer" id="viewer"><div class="wrap" id="wrap"><img id="jersey" src="images/jersey-337-5-front-left.jpg" alt="ROCK ESPORTS jersey, front-left view"></div><div class="hint">Drag left/right to tilt • Use buttons to zoom</div></section>
<div class="controls"><button id="left">↶ Tilt left</button><button id="auto" class="primary">▶ Auto spin</button><button id="right">Tilt right ↷</button><button id="out">− Zoom</button><button id="in">＋ Zoom</button><button id="reset">Reset view</button></div>
<div class="status" id="status">Tilt: 0° • Zoom: 100%</div>
<p class="note">This website uses your single supplied jersey image. It can tilt and zoom, but a true 360° garment spin requires separate images for all angles or a 3D model.</p></main><footer>ROCK ESPORTS • GITHUB PAGES</footer>
<script>
const wrap=document.getElementById('wrap'),viewer=document.getElementById('viewer'),autoBtn=document.getElementById('auto'),status=document.getElementById('status');
let tilt=0,zoom=1,auto=false,raf=null,last=0,drag=false,startX=0,startTilt=0,pinchStart=0,pinchZoom=1;
function draw(){wrap.style.transform=`perspective(1000px) rotateY(${tilt}deg) scale(${zoom})`;status.textContent=`Tilt: ${Math.round(tilt)}° • Zoom: ${Math.round(zoom*100)}%`}
function stop(){auto=false;autoBtn.textContent='▶ Auto spin';autoBtn.classList.add('primary');if(raf)cancelAnimationFrame(raf);raf=null;last=0}
function tick(t){if(!auto)return;if(last)tilt+=(t-last)*.036;last=t;draw();raf=requestAnimationFrame(tick)}
autoBtn.onclick=()=>{if(auto)stop();else{auto=true;autoBtn.textContent='Ⅱ Pause spin';autoBtn.classList.remove('primary');raf=requestAnimationFrame(tick)}};
document.getElementById('left').onclick=()=>{stop();tilt-=22.5;draw()};document.getElementById('right').onclick=()=>{stop();tilt+=22.5;draw()};
document.getElementById('in').onclick=()=>{zoom=Math.min(2.2,zoom+.15);draw()};document.getElementById('out').onclick=()=>{zoom=Math.max(.6,zoom-.15);draw()};
document.getElementById('reset').onclick=()=>{stop();tilt=0;zoom=1;draw()};
viewer.addEventListener('pointerdown',e=>{drag=true;startX=e.clientX;startTilt=tilt;viewer.setPointerCapture(e.pointerId);stop()});
viewer.addEventListener('pointermove',e=>{if(drag){tilt=startTilt+(e.clientX-startX)*.65;draw()}});
viewer.addEventListener('pointerup',()=>drag=false);viewer.addEventListener('pointercancel',()=>drag=false);
viewer.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchZoom=zoom}},{passive:true});
viewer.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchStart){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom=Math.max(.6,Math.min(2.2,pinchZoom*d/pinchStart));draw()}},{passive:true});
viewer.addEventListener('touchend',()=>pinchStart=0);draw();
</script></body></html>
